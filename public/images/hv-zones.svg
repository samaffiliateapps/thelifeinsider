<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 276" width="520" height="276" role="img" aria-label="Solana Gear heated vest zone map: front two pads at the hand pockets, back six pads in three rows including the lower back, one collar pad">
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e8551a"/></linearGradient>
  </defs>
  <style>
    .lab{font:700 13px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#1f2937}
    .sub{font:600 11px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#6b7280}
    .body{fill:#f3f4f6;stroke:#9ca3af;stroke-width:2}
    .pad{fill:url(#pad);stroke:#b43e0f;stroke-width:1.2;rx:5}
    .tag{font:600 11px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#b43e0f}
  </style>
  <!-- FRONT -->
  <text class="lab" x="130" y="22" text-anchor="middle">FRONT</text>
  <text class="sub" x="130" y="38" text-anchor="middle">2 pads · hand pockets</text>
  <path class="body" d="M75 70 q0-12 12-16 l18-6 q5 12 25 12 q20 0 25-12 l18 6 q12 4 12 16 v20 l-12 6 v170 h-98 v-170 l-12-6z"/>
  <line x1="130" y1="60" x2="130" y2="266" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect class="pad" x="86" y="196" width="34" height="40" rx="5"/>
  <rect class="pad" x="140" y="196" width="34" height="40" rx="5"/>
  <!-- BACK -->
  <text class="lab" x="390" y="22" text-anchor="middle">BACK</text>
  <text class="sub" x="390" y="38" text-anchor="middle">6 pads · upper, mid &amp; lower back + collar</text>
  <path class="body" d="M335 70 q0-12 12-16 l18-6 q5 12 25 12 q20 0 25-12 l18 6 q12 4 12 16 v20 l-12 6 v170 h-98 v-170 l-12-6z"/>
  <rect class="pad" x="366" y="52" width="48" height="16" rx="5"/>
  <rect class="pad" x="346" y="112" width="34" height="30" rx="5"/>
  <rect class="pad" x="400" y="112" width="34" height="30" rx="5"/>
  <rect class="pad" x="346" y="156" width="34" height="30" rx="5"/>
  <rect class="pad" x="400" y="156" width="34" height="30" rx="5"/>
  <rect class="pad" x="346" y="200" width="34" height="30" rx="5"/>
  <rect class="pad" x="400" y="200" width="34" height="30" rx="5"/>
  <text class="tag" x="470" y="60">collar</text>
  <text class="tag" x="470" y="130">upper</text>
  <text class="tag" x="470" y="174">mid</text>
  <text class="tag" x="470" y="218">lower</text>
</svg>
